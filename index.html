const weekAccents = ["#2d7a5e","#3a4fa3","#b05a1a","#7a2d7a"];
const weekLabels  = ["Vecka 1 – Grundläggning","Vecka 2 – Progression","Vecka 3 – Intensifiering","Vecka 4 – Toppa formen"];

let completed = {};
let completedDates = {};
try { completed      = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch(_) {}
try { completedDates = JSON.parse(localStorage.getItem(DATES_KEY)   || "{}"); } catch(_) {}

let openDay = null;
const timerState = {}; // key → { secs, total, running, interval }

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    localStorage.setItem(DATES_KEY,   JSON.stringify(completedDates));
  } catch(_) {}
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function getStreak() {
  const dates = [...new Set(Object.values(completedDates).filter(Boolean))].sort().reverse();
  if (!dates.length) return 0;
  const t = todayStr();
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (dates[0] !== t && dates[0] !== y) return 0;
  let streak = 1;
  for (let i = 1; i < dates.length; i++) {
    const diff = (new Date(dates[i - 1]) - new Date(dates[i])) / 86400000;
    if (diff === 1) streak++;
    else break;
  }
  return streak;
}

function totalDone() {
  return Object.values(completed).filter(Boolean).length;
}

function updateProgress() {
  const n = totalDone();
  document.getElementById("progress-text").textContent = n + " / 30 dagar";
  document.getElementById("progress-bar").style.width = (n / 30 * 100) + "%";
  document.getElementById("done-banner").style.display = n === 30 ? "block" : "none";
  const streak = getStreak();
  const sw = document.getElementById("streak-wrap");
  const sv = document.getElementById("streak-val");
  if (sw && sv) { sv.textContent = streak; sw.style.display = streak > 0 ? "block" : "none"; }
}

// --- Timer ---

function parseSeconds(sets) {
  const m = sets.match(/(\d+)s/);
  return m ? parseInt(m[1]) : null;
}

function timerKey(day, name) {
  return day + "-" + name.replace(/[^\wåäöÅÄÖ]/g, "_");
}

function toggleTimer(key, totalSecs) {
  if (!timerState[key]) timerState[key] = { secs: totalSecs, total: totalSecs, running: false };
  const t = timerState[key];
  if (t.running) {
    clearInterval(t.interval);
    t.running = false;
  } else {
    if (t.secs <= 0) t.secs = t.total;
    t.running = true;
    t.interval = setInterval(() => {
      t.secs--;
      refreshTimer(key);
      if (t.secs <= 0) {
        clearInterval(t.interval);
        t.running = false;
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }, 1000);
  }
  refreshTimer(key);
}

function resetTimer(key) {
  const t = timerState[key];
  if (!t) return;
  clearInterval(t.interval);
  t.secs = t.total;
  t.running = false;
  refreshTimer(key);
}

function refreshTimer(key) {
  const t = timerState[key];
  if (!t || !t.dispEl) return;
  t.dispEl.textContent = t.secs >= 60
    ? Math.floor(t.secs / 60) + ":" + String(t.secs % 60).padStart(2, "0")
    : t.secs + "s";
  const pct = t.total > 0 ? t.secs / t.total : 1;
  t.dispEl.style.color = t.secs <= 0 ? "#2d7a5e" : pct > 0.5 ? "#2d7a5e" : pct > 0.2 ? "#b05a1a" : "#c0392b";
  if (t.btnEl) t.btnEl.textContent = t.running ? "⏸" : "▶";
}

function renderDay(d, wi) {
  const accent = weekAccents[wi];
  const done = !!completed[d.day];
  const isOpen = openDay === d.day;

  const btn = document.createElement("button");
  btn.className = "day-btn" + (done ? " done" : "");
  btn.style.background = done ? accent : "#fff";
  btn.style.borderColor = done ? accent : "#ddd";
  if (isOpen) btn.style.boxShadow = `0 0 0 3px ${accent}44`;
  btn.innerHTML = `<div class="lbl">Dag</div><div class="num">${d.day}</div>${done ? '<div class="check">✓</div>' : ''}`;
  btn.addEventListener("click", () => { openDay = isOpen ? null : d.day; render(); });
  return btn;
}

function renderDetail(d, wi) {
  const accent = weekAccents[wi];
  const done = !!completed[d.day];
  const panel = document.createElement("div");
  panel.className = "detail-panel";

  // Header
  const header = document.createElement("div");
  header.className = "detail-header";
  const titleDiv = document.createElement("div");
  titleDiv.innerHTML = `<div class="detail-day-label">Dag ${d.day}</div><div class="detail-focus">${d.focus}</div>`;
  const markBtn = document.createElement("button");
  markBtn.className = "mark-btn";
  markBtn.style.cssText = `border-color:${accent};background:${done ? accent : "transparent"};color:${done ? "#fff" : accent}`;
  markBtn.textContent = done ? "✓ Klar!" : "Markera klar";
  markBtn.addEventListener("click", () => {
    completed[d.day] = !completed[d.day];
    if (completed[d.day]) completedDates[d.day] = todayStr();
    else delete completedDates[d.day];
    save(); render(); updateProgress();
  });
  header.appendChild(titleDiv);
  header.appendChild(markBtn);
  panel.appendChild(header);

  // Exercises
  const exercisesDiv = document.createElement("div");
  exercisesDiv.className = "exercises";

  d.exercises.forEach(ex => {
    const exDiv = document.createElement("div");
    exDiv.className = "exercise";
    exDiv.style.borderLeftColor = accent;

    const row = document.createElement("div");
    row.className = "exercise-row";

    const nameLink = document.createElement("a");
    nameLink.className = "exercise-name";
    nameLink.href = "https://www.google.com/search?q=" + encodeURIComponent(ex.name);
    nameLink.target = "_blank";
    nameLink.rel = "noopener noreferrer";
    nameLink.textContent = ex.name;

    const setsSpan = document.createElement("span");
    setsSpan.className = "exercise-sets";
    setsSpan.style.cssText = `background:${accent}18;color:${accent}`;
    setsSpan.textContent = ex.sets;

    row.appendChild(nameLink);
    row.appendChild(setsSpan);

    const tip = document.createElement("div");
    tip.className = "exercise-tip";
    tip.textContent = "💡 " + ex.tip;

    exDiv.appendChild(row);
    exDiv.appendChild(tip);

    const secs = parseSeconds(ex.sets);
    if (secs) {
      const key = timerKey(d.day, ex.name);
      if (!timerState[key]) timerState[key] = { secs, total: secs, running: false };

      const wrap = document.createElement("div");
      wrap.className = "timer-wrap";

      const disp = document.createElement("span");
      disp.className = "timer-display";
      disp.textContent = timerState[key].secs + "s";
      timerState[key].dispEl = disp;

      const playBtn = document.createElement("button");
      playBtn.className = "timer-btn";
      playBtn.setAttribute("aria-label", "Starta");
      playBtn.textContent = timerState[key].running ? "⏸" : "▶";
      playBtn.addEventListener("click", () => toggleTimer(key, secs));
      timerState[key].btnEl = playBtn;

      const rstBtn = document.createElement("button");
      rstBtn.className = "timer-reset";
      rstBtn.title = "Återställ";
      rstBtn.textContent = "↺";
      rstBtn.addEventListener("click", () => resetTimer(key));

      wrap.appendChild(disp);
      wrap.appendChild(playBtn);
      wrap.appendChild(rstBtn);
      exDiv.appendChild(wrap);
    }

    exercisesDiv.appendChild(exDiv);
  });

  panel.appendChild(exercisesDiv);

  // Skill (calisthenics-färdighet)
  if (d.skill) {
    const heading = document.createElement("div");
    heading.className = "skill-heading";
    heading.textContent = "🎯 Färdighetsträning";
    panel.appendChild(heading);

    const skillDiv = document.createElement("div");
    skillDiv.className = "exercise";
    skillDiv.style.borderLeftColor = accent;

    const row = document.createElement("div");
    row.className = "exercise-row";

    const nameLink = document.createElement("a");
    nameLink.className = "exercise-name";
    nameLink.href = "https://www.google.com/search?q=" + encodeURIComponent(d.skill.name);
    nameLink.target = "_blank";
    nameLink.rel = "noopener noreferrer";
    nameLink.textContent = d.skill.name;

    const setsSpan = document.createElement("span");
    setsSpan.className = "exercise-sets";
    setsSpan.style.cssText = `background:${accent}18;color:${accent}`;
    setsSpan.textContent = d.skill.sets;

    row.appendChild(nameLink);
    row.appendChild(setsSpan);

    const badge = document.createElement("div");
    badge.className = "skill-badge";
    badge.style.cssText = `background:${accent}18;color:${accent}`;
    badge.textContent = d.skill.track;

    const tip = document.createElement("div");
    tip.className = "exercise-tip";
    tip.textContent = "💡 " + d.skill.tip;

    skillDiv.appendChild(row);
    skillDiv.appendChild(badge);
    skillDiv.appendChild(tip);

    const secs = parseSeconds(d.skill.sets);
    if (secs) {
      const key = timerKey(d.day, "skill-" + d.skill.name);
      if (!timerState[key]) timerState[key] = { secs, total: secs, running: false };

      const wrap = document.createElement("div");
      wrap.className = "timer-wrap";

      const disp = document.createElement("span");
      disp.className = "timer-display";
      disp.textContent = timerState[key].secs + "s";
      timerState[key].dispEl = disp;

      const playBtn = document.createElement("button");
      playBtn.className = "timer-btn";
      playBtn.setAttribute("aria-label", "Starta");
      playBtn.textContent = timerState[key].running ? "⏸" : "▶";
      playBtn.addEventListener("click", () => toggleTimer(key, secs));
      timerState[key].btnEl = playBtn;

      const rstBtn = document.createElement("button");
      rstBtn.className = "timer-reset";
      rstBtn.title = "Återställ";
      rstBtn.textContent = "↺";
      rstBtn.addEventListener("click", () => resetTimer(key));

      wrap.appendChild(disp);
      wrap.appendChild(playBtn);
      wrap.appendChild(rstBtn);
      skillDiv.appendChild(wrap);
    }

    panel.appendChild(skillDiv);
  }

  return panel;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const weekBoundaries = [0, 7, 14, 21, 30];
  [0,1,2,3].forEach(wi => {
    const week = program.slice(weekBoundaries[wi], weekBoundaries[wi + 1]);
    const section = document.createElement("div");
    section.className = "week-section";

    const label = document.createElement("div");
    label.className = "week-label";
    label.style.color = weekAccents[wi];
    label.textContent = weekLabels[wi];
    section.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "day-grid";
    week.forEach(d => grid.appendChild(renderDay(d, wi)));
    section.appendChild(grid);

    if (openDay && week.some(d => d.day === openDay)) {
      const d = program.find(x => x.day === openDay);
      section.appendChild(renderDetail(d, wi));
    }

    main.appendChild(section);
  });

  // Done banner
  const banner = document.createElement("div");
  banner.id = "done-banner";
  banner.style.display = totalDone() === 30 ? "block" : "none";
  banner.innerHTML = `<div class="trophy">🏆</div><h2>30 dagar avklarade!</h2><p>Du är starkare, mer stabil och mer disciplinerad än när du började.</p>`;
  main.appendChild(banner);
}

document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Nollställ alla 30 dagar? Det går inte att ångra.")) return;
  completed = {};
  completedDates = {};
  openDay = null;
  Object.keys(timerState).forEach(k => { clearInterval(timerState[k].interval); delete timerState[k]; });
  save();
  render();
  updateProgress();
});

render();
updateProgress();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
